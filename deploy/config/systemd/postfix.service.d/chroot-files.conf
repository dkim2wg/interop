# Debian's `postfix check` copies resolv.conf/services into the chroot with
# cp -pLu: -p keeps the systemd-resolve owner of stub-resolv.conf ("not owned
# by root" warning) and -u never refreshes a chroot services that is newer
# than /etc/services ("differ" warning). Install root-owned copies first,
# keeping mtimes, so cp -u then leaves them alone.
[Service]
ExecStartPre=
ExecStartPre=+/usr/bin/install -p -o root -g root -m 0644 /etc/resolv.conf /var/spool/postfix/etc/resolv.conf
ExecStartPre=+/usr/bin/install -p -o root -g root -m 0644 /etc/services /var/spool/postfix/etc/services
ExecStartPre=+postfix check
