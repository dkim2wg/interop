[mailman]
site_owner: admin@dkim2.com
layout: fhs

[paths.fhs]
bin_dir: /opt/mailman/venv/bin
var_dir: /var/lib/mailman3
log_dir: /var/log/mailman3
lock_dir: /var/lib/mailman3/locks
data_dir: /var/lib/mailman3/data
etc_dir: /etc/mailman3
ext_dir: /etc/mailman3/ext
queue_dir: /var/lib/mailman3/queue
pid_file: /run/mailman3/master.pid
template_dir: /var/lib/mailman3/templates

[database]
class: mailman.database.sqlite.SQLiteDatabase
url: sqlite:////var/lib/mailman3/mailman.db

[mta]
incoming: mailman.mta.postfix.LMTP
outgoing: mailman.mta.deliver.deliver
lmtp_host: 127.0.0.1
lmtp_port: 8024
smtp_host: localhost
smtp_port: 10587
configuration: /etc/mailman3/postfix-mailman.cfg
message_instance: yes

[webservice]
hostname: localhost
port: 8001
admin_user: restadmin
admin_pass: __MAILMAN_REST_PASS__

[archiver.hyperkitty]
class: mailman_hyperkitty.Archiver
enable: yes
configuration: /etc/mailman3/mailman-hyperkitty.cfg
