domain sympa.dkim2.com
listmaster admin@dkim2.com
wwsympa_url https://sympa.dkim2.com/sympa
email sympa
db_type SQLite
db_name /var/lib/sympa/sympa.sqlite
sendmail /usr/local/bin/sympa-sendmail
log_level 3
# One recipient per sendmail call, so each signed copy's rt= names only its own
# recipient (docs/dkim2-postfix-list-host-guide.md, Recipient privacy).
nrcpt 1
